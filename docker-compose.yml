# Legacy/development only. The supported host setup (npm run host:setup) uses a
# dedicated PostgreSQL 16 cluster in .local/postgres on 127.0.0.1:55432 and does
# not use Docker. Do not start this alongside a host:setup installation.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-phone_farm}
      POSTGRES_USER: ${POSTGRES_USER:-phone_farm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - phone-farm-postgres:/var/lib/postgresql/data

volumes:
  phone-farm-postgres:
